<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/me_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Leo Wei - software engineer and machine learning researcher. Portfolio." />
    <meta name="theme-color" content="#f3f0e9" />
    <title>Leo Wei</title>
    <script>
      // Set theme before first paint to avoid a flash
      try {
        var saved = localStorage.getItem("portfolio_theme");
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
